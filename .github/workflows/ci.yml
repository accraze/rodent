name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-xcb-dev libxcb1-dev libxcb-dri2-0-dev libxcb-icccm4-dev \
            libxcursor-dev libxkbcommon-dev libxcb-shape0-dev libxcb-xfixes0-dev libgl-dev

      # rust-toolchain.toml selects the toolchain; this just makes sure fmt and clippy are present
      - run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
      - run: cargo clippy --release --lib
      - run: cargo test --release --lib
      - run: cargo xtask bundle rodent --release

      - uses: actions/upload-artifact@v7
        with:
          name: rodent-linux
          path: |
            target/bundled/Rodent.clap
            target/bundled/Rodent.vst3
